name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.2'
            fabric: '0.152.1+26.2'
          - minecraft: '26.3'
            fabric: '0.161.0+26.3'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build and test (Minecraft ${{ matrix.minecraft }})
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_version=${{ matrix.fabric }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shulker-insight-${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
